name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     target_os: macos,   stamp: macos,   marlinspike_ref: main }
          - { os: ubuntu-22.04, target_os: linux,   stamp: linux,   marlinspike_ref: main }
          - { os: windows-2022, target_os: windows, stamp: windows, marlinspike_ref: main }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target_os }}
    env:
      MARLINSPIKE_SRC: ${{ github.workspace }}/marlinspike
      GLASSMARLIN_TARGET_OS_STAMP: ${{ matrix.stamp }}
    steps:
      - name: Checkout glassmarlin
        uses: actions/checkout@v4

      - name: Checkout marlinspike (bundled into the app)
        uses: actions/checkout@v4
        with:
          repository: eris-ot/marlinspike
          ref: ${{ matrix.marlinspike_ref }}
          path: marlinspike

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Linux — Tauri / WebKit prerequisites
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            zstd

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build runtime bundle
        shell: bash
        run: ./scripts/build-bundle.sh

      - name: Tauri build (release)
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glassmarlin-${{ matrix.target_os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: ignore
